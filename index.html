<!DOCTYPE html>
<html>
<head>
<title>AI Study Helper</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Chat Box */
.chat-container {
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
}

/* Header */
.header {
    background: #6c5ce7;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

/* Messages */
.chat-box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

/* Input */
.input-area {
    display: flex;
    border-top: 1px solid #ccc;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
}

button {
    padding: 10px;
    border: none;
    background: #6c5ce7;
    color: white;
    cursor: pointer;
}

/* Messages style */
.user {
    text-align: right;
    margin: 5px;
}

.bot {
    text-align: left;
    margin: 5px;
    color: green;
}
</style>
</head>

<body>

<div class="chat-container">

<div class="header">
🤖 AI Study Helper  
<br>By Huzaif Ajaz Deshmukh
</div>

<div class="chat-box" id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Ask anything...">
<button onclick="send()">Send</button>
</div>

</div>

<script>
function send() {
    let input = document.getElementById("input");
    let chat = document.getElementById("chat");

    let userText = input.value;
    if(userText === "") return;

    chat.innerHTML += "<div class='user'>👤 " + userText + "</div>";

    let reply = getReply(userText.toLowerCase());

    setTimeout(() => {
        chat.innerHTML += "<div class='bot'>🤖 " + reply + "</div>";
        chat.scrollTop = chat.scrollHeight;
    }, 500);

    input.value = "";
}

function getReply(q) {

    if(q.includes("math")) return "📘 Try solving step by step and practice daily.";
    if(q.includes("science")) return "🔬 Focus on understanding concepts and diagrams.";
    if(q.includes("history")) return "📜 Learn timelines and key events.";
    if(q.includes("hello")) return "👋 Hello! How can I help you?";
    if(q.includes("who made you")) return "👑 I was created by Huzaif Ajaz Deshmukh.";

    return "🤖 I’m a simple AI right now. For real AI, click below 👇<br><a href='https://chat.openai.com' target='_blank'>Open Real AI</a>";
}
</script>

</body>
</html>
