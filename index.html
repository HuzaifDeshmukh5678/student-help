<!DOCTYPE html>
<html>
<head>
<title>AI Study Helper</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Login Page */
#loginPage {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

/* Chat Box */
.chat-container {
    width: 350px;
    height: 500px;
    background: white;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
}

.header {
    background: #6c5ce7;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

.chat-box {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
}

.input-area {
    display: flex;
    border-top: 1px solid #ccc;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
}

button {
    padding: 10px;
    border: none;
    background: #6c5ce7;
    color: white;
    cursor: pointer;
}

.user {
    text-align: right;
    margin: 5px;
}

.bot {
    text-align: left;
    margin: 5px;
    color: green;
}
</style>
</head>

<body>

<div id="loginPage">
<h2>🔐 Login</h2>
<input id="username" placeholder="Enter your name"><br><br>
<button onclick="login()">Login</button>
</div>

<div id="chatPage" style="display:none;">
<div class="chat-container">

<div class="header">
🤖 AI Study Helper  
<br>By Huzaif Ajaz Deshmukh
</div>

<div class="chat-box" id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Ask anything...">
<button onclick="send()">Send</button>
</div>

</div>
</div>

<script>

// LOGIN
function login() {
    let name = document.getElementById("username").value;
    if(name === "") return alert("Enter your name!");
    localStorage.setItem("user", name);
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("chatPage").style.display = "block";
}

// AUTO LOGIN
window.onload = function() {
    if(localStorage.getItem("user")) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("chatPage").style.display = "block";
    }
};

// SEND MESSAGE
async function send() {
    let input = document.getElementById("input");
    let chat = document.getElementById("chat");

    let userText = input.value;
    if(userText === "") return;

    chat.innerHTML += "<div class='user'>👤 " + userText + "</div>";

    let response = await fetch("YOUR_BACKEND_URL", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userText })
    });

    let data = await response.json();

    chat.innerHTML += "<div class='bot'>🤖 " + data.reply + "</div>";
    chat.scrollTop = chat.scrollHeight;

    input.value = "";
}

</script>

</body>
</html>
