<!DOCTYPE html>
<html>
<head>
    <title>Study Help by Huzaif Ajaz Deshmukh</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            text-align: center;
            padding: 20px;
            color: #2c3e50;
        }

        h1 {
            font-size: 40px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }

        textarea {
            width: 90%;
            height: 100px;
            border-radius: 10px;
            padding: 10px;
        }

        button {
            padding: 12px 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2980b9;
        }

        #answer {
            margin-top: 20px;
            font-size: 18px;
            color: #27ae60;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>📚 Study Help</h1>
    <p>✨ Created by Mahejabeen (Class 8)</p>

    <div class="box">
        <h3>Ask your question 👇</h3>

        <textarea id="question" placeholder="Type your question..."></textarea><br><br>

        <button onclick="answerQuestion()">Get Answer</button>

        <div id="answer"></div>
    </div>

    <div class="footer">
        🚀 Keep learning, keep growing!
    </div>

    <script>
        function answerQuestion() {
            let q = document.getElementById("question").value;

            if(q === "") {
                document.getElementById("answer").innerHTML = "⚠️ Please enter a question!";
            } 
            else if(q.toLowerCase().includes("math")) {
                document.getElementById("answer").innerHTML = "📘 Try solving step by step and check examples from your book.";
            }
            else if(q.toLowerCase().includes("science")) {
                document.getElementById("answer").innerHTML = "🔬 Science needs understanding—revise concepts and diagrams!";
            }
            else {
                document.getElementById("answer").innerHTML = "👍 Good question! Try researching or ask your teacher.";
            }
        }
    </script>

</body>
</html>
